services:
  postgres:
    image: postgres:16
    container_name: kamadeva_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: kamadeva_user
      POSTGRES_PASSWORD: kamadeva_password
      POSTGRES_DB: kamadeva_db
    volumes:
      - kamadeva_postgres_data:/var/lib/postgresql/data
  pgadmin:
    image: dpage/pgadmin4
    container_name: kamadeva_pgadmin
    restart: always
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@kamadeva.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    depends_on:
      - postgres
volumes:
  kamadeva_postgres_data:
